[project]
name = "llmx"
version = "0.1.0"
description = "Practice code for Ed Donner's LLM Engineering course"
requires-python = ">=3.12"
dependencies = [
    # week 1-2: everything you need so far
    "openai>=1.109.1",
    "anthropic>=0.69.0",
    "google-genai>=1.41.0",
    "litellm>=1.77.5",
    "ollama>=0.6.0",
    "gradio>=5.47.2,<6.0",
    "beautifulsoup4>=4.14.2",
    "requests>=2.32.5",
    "python-dotenv>=1.1.1",
    "tiktoken>=0.11.0",
    "ipykernel>=6.30.1",
    "ipywidgets>=8.1.7",
    "python-dotenv>=1.1.1",
    # add the rest with `uv add <pkg>` as each week needs it
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmx"]
